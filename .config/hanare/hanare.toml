# hanare host configuration (see ~/.local/src/hanare/examples/hanare.toml)

[guest]
flake = "~/.config/hanare/guest"

[vm]
cpus = 2
memory = "4G"
disk_size = "20G"
vsock_cid = 4242

[[share]]
path = "~/Work"

[[share]]
path = "~/Projects"

[commands]
expose = []
# Always run these without network (like "hanare run --offline").
offline = ["z3", "cvc5", "tlc", "alloy6", "spin", "NuSMV", "cbmc", "lean", "coqc", "why3", "dafny"]

[network]
# true: allow the guest to reach LAN, Tailscale (CGNAT) and link-local addresses.
allow_lan = false
