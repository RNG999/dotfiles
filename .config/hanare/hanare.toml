# hanare guests (see ~/.local/src/hanare/examples/hanare.toml)

# Guest used when no NAME / -g / $HANARE_GUEST is given.
default = "dev"

[guests.dev]
flake = "~/.config/hanare/guest"   # nixosConfigurations.<attr> in this flake is the guest OS
attr = "hanare"
cpus = 2
memory = "4G"
disk_size = "20G"
# true: let the guest reach LAN, Tailscale (CGNAT) and link-local addresses.
allow_lan = false
# ~/.local/bin links that run these commands in this guest ("hanare link sync").
expose = []
# Commands that always run without network (like "hanare run --offline").
offline = ["z3", "cvc5", "tlc", "alloy6", "spin", "NuSMV", "cbmc", "lean", "coqc", "why3", "dafny"]

[[guests.dev.share]]
path = "~/Work"

[[guests.dev.share]]
path = "~/Projects"

