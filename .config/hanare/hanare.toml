# hanare guests (see ~/.local/src/hanare/examples/hanare.toml)
version = 1
default_guest = "dev"

[policy]
# "hanare share add" outside these asks for confirmation.
share_roots = ["~/Work", "~/Projects"]

[guests.dev]
description = "formal methods tools"
flake = "~/.config/hanare/guest"   # nixosConfigurations.<attr> in this flake is the guest OS
attr = "hanare"
cpus = 2
memory = "4G"
network = "filtered"               # none | filtered (internet only) | lan

[guests.dev.commands]
link = []
# Always run without network.
offline = ["z3", "cvc5", "tlc", "alloy6", "spin", "NuSMV", "cbmc", "lean", "coqc", "why3", "dafny"]

[[guests.dev.share]]
path = "~/Work"

[[guests.dev.share]]
path = "~/Projects"
